# ruff.toml: strict on purpose. Every rule is on; each exception below says why.

line-length = 100
target-version = "py312"
# Typing case files contain deliberate errors and are checked by tests/repo/typing/test_typing.py.
# Template files hold {{placeholders}}; tests/ts/template checks a generated project instead.
extend-exclude = ["planning", "tests/repo/typing/cases", "src/tslab/lab/templates", "src/tslab/ts/templates"]

[lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter (ruff docs: "incompatible with the formatter").
    "CPY001", # The BSD-3-Clause license lives in LICENSE, not in a header in every file.
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # pytest checks with plain assert.
    "PLR2004", # Tests compare against literal expected values.
    "D100",    # Test modules, classes and functions are named after what they check;
    "D101",    # docstrings would repeat the name.
    "D102",
    "D103",
    "D107",
    "INP001",  # tests/ is not a package: pytest imports helpers from the folder of the test, or from tests/unit (pythonpath).
    "ARG001",  # Stage functions and test doubles keep the signature their interface requires,
    "ARG002",  # even when a test does not use every argument.
]
"examples/**/*.py" = [
    "INP001", # Examples are scripts run by path, not packages.
    "T201",   # They print their results.
]
"docs/conf.py" = ["INP001"]  # Sphinx reads it by path.

[lint.pydocstyle]
convention = "google"

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.isort]
# The formatter drops magic trailing commas, so isort must not rely on them.
split-on-trailing-comma = false
combine-as-imports = true
force-sort-within-sections = true
order-by-type = false

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
