name: Changelog fragment

# Creates a towncrier fragment from the PR title and checks one is present.
# Labels and skip rules: see the shared workflow.

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, labeled, unlabeled]

jobs:
  fragment:
    permissions:
      contents: write
    uses: chronocratic/.github/.github/workflows/auto-changelog-fragment.yml@v0.1.1
