name: Publish docs

# Triggers a Read the Docs build of main and the new tag. Needs RTD_WEBHOOK_URL
# and RTD_WEBHOOK_TOKEN in the `rtd` environment.

on:
  release:
    types: [published]

jobs:
  docs:
    uses: chronocratic/.github/.github/workflows/docs-publish.yml@v0.1.2
    with:
      docs-url: https://tslab.readthedocs.io/
    secrets: inherit
