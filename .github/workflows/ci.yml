name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version is read from git tags
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        # The tracker extras are needed by the tracking tests; chronocratic has its own job (M6).
        run: uv sync --locked --extra wandb --extra mlflow --extra tensorboard
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run ty check
      - name: Tests
        run: uv run pytest -m "not chronocratic"
