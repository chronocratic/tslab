name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Slow tests (real training, example and template runs) only run on PRs into
# main and on manual runs; dev pushes and other PRs run the fast suite.
env:
  RUN_SLOW: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' }}

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version is read from git tags
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        # The tracker extras are needed by the tracking tests; chronocratic has its own job.
        run: uv sync --locked --extra wandb --extra mlflow --extra tensorboard
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run ty check
      - name: Tests
        run: |
          if [ "$RUN_SLOW" = true ]; then skip=""; else skip=" and not slow"; fi
          uv run pytest -m "not chronocratic$skip"

  chronocratic:
    # Adapter tests, examples/advanced and the generated-project test.
    name: chronocratic adapters (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Tests
        run: |
          if [ "$RUN_SLOW" = true ]; then skip=""; else skip=" and not slow"; fi
          uv run pytest -m "chronocratic$skip"

  docs:
    # Same build as Read the Docs; warnings fail it.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --group docs
      - name: Build
        run: uv run sphinx-build -W --keep-going docs docs/_build/html
