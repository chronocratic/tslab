name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Slow tests (real training, example and template runs) only run on PRs into
# dev or main and on manual runs; pushes and other PRs run the fast suite.
env:
  RUN_SLOW: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'dev' || github.base_ref == 'main' }}

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version is read from git tags
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        # All extras so ty can resolve the chronocratic adapters; those tests run in their own job.
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run ty check
      - name: Tests
        run: |
          if [ "$RUN_SLOW" = true ]; then skip=""; else skip=" and not slow"; fi
          uv run pytest -m "not chronocratic$skip" --cov=src/tslab --cov-report=term-missing:skip-covered

  chronocratic:
    # Adapter tests, examples/advanced and the generated-project test.
    name: chronocratic adapters (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Tests
        run: |
          if [ "$RUN_SLOW" = true ]; then skip=""; else skip=" and not slow"; fi
          uv run pytest -m "chronocratic$skip" --cov=src/tslab --cov-report=term-missing:skip-covered

  lab-without-torch:
    # the base install (no extras) must run tslab.lab without torch, Lightning, sklearn and safetensors.
    name: lab without torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-dev --group lab-test
      - name: Check torch is absent
        run: uv run --no-sync python -c "import importlib.util as u; assert u.find_spec('torch') is None"
      - name: Tests
        run: uv run --no-sync pytest tests/lab -q -n auto
      - name: Install the analysis extra
        run: uv sync --locked --no-dev --group lab-test --extra analysis
      - name: Analysis tests
        run: uv run --no-sync pytest tests/lab/unit/analysis -q -n auto

  docs:
    # Same build as Read the Docs; warnings fail it.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --group docs
      - name: Build
        run: uv run sphinx-build -W --keep-going docs docs/_build/html
