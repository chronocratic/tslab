name: Main Pre-merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  gate:
    uses: chronocratic/.github/.github/workflows/main-pre-merge-gate.yml@v0.1.1
    with:
      # The shared default plus planning/.
      forbidden: |
        .claude/
        .remember/
        .planning/
        planning/
        MEMORY.md
        CLAUDE.md
        CONTEXT.md
        STATE.md
        ROADMAP.md
        .continue-here.md
        HANDOFF.json
