name: Release prep

# Builds CHANGELOG.md from towncrier fragments on dev and opens a PR into dev.
# Needs FF_MERGE_TOKEN in the `ff_merge` environment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.1.0a2)"
        required: true
        type: string

jobs:
  prep:
    permissions:
      contents: write
      pull-requests: write
    uses: chronocratic/.github/.github/workflows/release-prep.yml@v0.1.1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
