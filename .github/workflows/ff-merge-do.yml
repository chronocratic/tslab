name: Fast Forward Merge

# Needs FF_MERGE_TOKEN (PAT of a ruleset bypass actor) in the `ff_merge` environment.

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: chronocratic/.github/.github/workflows/ff-merge-do.yml@v0.1.1
    secrets: inherit
