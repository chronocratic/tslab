[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "tslab"
dynamic = ["version"]
description = "Resumable, cached research pipelines for time series representation learning."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "The Chronocratic Developers", email = "github@users.noreply.github.com" }]
keywords = ["time series", "representation learning", "pytorch", "lightning", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1,<3",
    "pyyaml>=6.0",
    "rich>=14,<16",
    "tyro>=1.0,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.4,<3", "lightning>=2.5,<3", "safetensors>=0.4"]
ts = ["tslab[ml]", "scikit-learn>=1.6,<2"]
chronocratic-models = ["tslab[ts]", "chronocratic-models==0.1.0rc1"]
chronocratic-datasets = ["tslab[ts]", "chronocratic-datasets==0.1.0rc1"]
# the private x_* settings of wandb are version-unstable; the range is pinned to the version the
# settings were verified against (see tslab/ml/tracking/wandb_tracker.py).
wandb = ["tslab[ml]", "wandb>=0.30,<0.31"]
# only `tslab wandb-sync`, for a login node without torch
wandb-sync = ["wandb>=0.30,<0.31"]
mlflow = ["tslab[ml]", "mlflow>=3.0,<4"]
tensorboard = ["tslab[ml]", "tensorboard>=2.18"]
analysis = ["pandas>=3.1,<4", "scipy>=1.18,<2", "matplotlib>=3.11,<4"]
full = ["tslab[ts,chronocratic-models,chronocratic-datasets,analysis]"]

[project.scripts]
tslab = "tslab.cli:main"

[project.urls]
Repository = "https://github.com/chronocratic/tslab"

[dependency-groups]
# the lab tests on the bare base install, outside the dev group
lab-test = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
]
dev = [
    "ipython>=9.18",
    "matplotlib>=3.11",
    "pandas>=3.1",
    "scipy>=1.18",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.17",
    "towncrier>=24.8",
    "torchdata>=0.11",
    "ty>=0.0.88",
    "types-pyyaml>=6.0",
    "pandas-stubs>=3.1,<3.2",
]
docs = [
    "myst-parser>=4.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8.2",
]

[tool.hatch.version]
# The version comes from the git tag (v0.1.0a1 gives 0.1.0a1); between tags it
# is a development version such as 0.1.0a2.dev3.
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/tslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Slow tests are skipped by default; `pytest -m ""` runs everything.
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: long-running tests (real training, subprocess kills, template creation); skipped by default, run in CI on PRs into main",
    "chronocratic: needs the chronocratic-models and chronocratic-datasets extras",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Strict: every rule is an error, including the ones ty leaves off by default
# (for example missing @override decorators and unsound returns of Any).
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
# Case files contain deliberate type errors; tests/repo/typing/test_typing.py checks them one by one.
# Template files of both layers hold {{placeholders}}; tests/ts/template checks a generated project instead.
exclude = ["tests/repo/typing/cases", "src/tslab/lab/templates", "src/tslab/ts/templates"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## v{version} ({project_date})"
issue_format = "[#{issue}](https://github.com/chronocratic/tslab/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
